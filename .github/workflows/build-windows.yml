name: Windows desktop installer

on:
  push:
    paths:
      - "package.json"
      - "desktop/**"
      - "editor/**"
      - "codec/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "package.json"
      - "desktop/**"
      - "editor/**"
      - "codec/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check desktop/main.cjs
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GuliKit-APG-Editor-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
