name: APG codec tests

on:
  push:
    paths:
      - "codec/**"
      - "editor/**"
      - "desktop/**"
      - "package.json"
      - ".github/workflows/test-apg-codec.yml"
  pull_request:
    paths:
      - "codec/**"
      - "editor/**"
      - ".github/workflows/test-apg-codec.yml"
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1 || (tail -n 100 /tmp/playwright-install.log; exit 1)
      - run: node --check editor/app.mjs
      - run: node --check desktop/main.cjs
      - run: node --test editor/browser-e2e.test.mjs
      - run: node --test codec/*.test.mjs editor/*.test.mjs
