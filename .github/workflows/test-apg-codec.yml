name: APG codec tests

on:
  push:
    paths:
      - "codec/**"
      - ".github/workflows/test-apg-codec.yml"
  pull_request:
    paths:
      - "codec/**"
      - ".github/workflows/test-apg-codec.yml"
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test codec/*.test.mjs
