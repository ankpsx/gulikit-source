name: Validate GuliKit APG sample

on:
  push:
    paths:
      - "verification/apg-sample-validator/**"
      - ".github/workflows/validate-apg-sample.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-auto-apg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm both sample files exist
        working-directory: verification/apg-sample-validator
        run: |
          test -f Auto.apg
          test -f macro.json

      - name: Cross-check APG binary against JSON export
        working-directory: verification/apg-sample-validator
        run: node verify-apg.mjs Auto.apg macro.json
